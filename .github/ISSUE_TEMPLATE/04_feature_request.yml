name: "✨ 기능 제안"
description: "새로운 기능이나 개선 아이디어를 제안해 주세요."
title: "[Feature] "
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: "제안해 주셔서 감사합니다! 아이디어를 자세히 들려주세요."

  - type: textarea
    id: problem
    attributes:
      label: 제안 배경 / 해결하려는 문제
      description: 어떤 불편함이나 필요에서 나온 제안인가요?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 원하는 동작
      description: 어떻게 동작하면 좋을지 구체적으로 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 참고
      description: 고려해 본 다른 방법이나 참고할 만한 사례가 있다면.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
    validations:
      required: false
