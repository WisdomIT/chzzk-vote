name: Cleanup preview

# PR 머지/닫힘 시 preview 정리.
# pull_request_target(closed)은 base 브랜치 컨텍스트에서 실행되어
# 머지 직후 PR merge-ref가 사라져도 취소되지 않는다.
# (PR 코드를 checkout 하지 않으므로 fork PR에도 안전)
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "정리할 PR 번호"
        required: true

permissions:
  contents: read
  pull-requests: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  teardown:
    # 릴리스 PR(dev→master, head=dev)은 teardown 대상이 아니다.
    # (deploy.yml에서 PR preview를 만들지 않으며, dev preview는 상시 유지)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "num=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "num=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Remove Vercel preview deployments for this PR
        run: |
          N="${{ steps.pr.outputs.num }}"
          hosts=$(vercel list chzzk-vote \
            --meta prNumber=$N \
            --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null \
            | grep -Eo '[a-z0-9-]+\.vercel\.app' \
            | grep -v '^chzzk-vote\.vercel\.app$' \
            | sort -u || true)
          if [ -z "$hosts" ]; then
            echo "제거할 preview 배포가 없습니다 (PR #$N)."
          else
            echo "$hosts" | while read -r h; do
              [ -n "$h" ] || continue
              echo "Removing $h"
              vercel remove "$h" --yes --token=${{ secrets.VERCEL_TOKEN }} || true
            done
          fi

      # PRs 환경은 여러 PR이 공유하므로 환경을 지우지 않고,
      # 이 PR의 head 브랜치(ref)로 기록된 배포만 inactive로 전환한다.
      - name: Deactivate GitHub deployments of this PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number('${{ steps.pr.outputs.num }}');
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const ref = pr.head.ref;
            const environment = 'PRs';

            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment, ref, per_page: 100,
            });
            if (deployments.length === 0) {
              core.info(`비활성화할 배포가 없습니다 (PR #${pull_number}, ref=${ref}).`);
              return;
            }
            for (const d of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: d.id, per_page: 1,
              });
              if (statuses[0]?.state === 'inactive') continue;
              core.info(`${environment}.${d.id} (${ref} @ ${d.sha.slice(0, 7)}) → inactive`);
              await github.rest.repos.createDeploymentStatus({
                owner, repo, deployment_id: d.id,
                state: 'inactive', auto_inactive: false,
              });
            }
