name: Deploy (Vercel)

on:
  push:
    branches: [master, dev]
  pull_request:
    types: [opened, synchronize, reopened]

# 같은 ref의 이전 실행은 취소 (중복 배포 방지)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # 릴리스 PR(dev→master, head=dev)은 PR preview를 만들지 않는다.
    # dev push의 Preview 배포가 이미 존재하므로 중복이며,
    # 머지 시 teardown되면 dev preview가 내려간 것과 같은 효과가 난다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # master → production, dev push → Preview, PR → pr-<번호>
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "prod=true"         >> "$GITHUB_OUTPUT"
            echo "env=production"    >> "$GITHUB_OUTPUT"
            echo "gh_env=Production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "prod=false"     >> "$GITHUB_OUTPUT"
            echo "env=preview"    >> "$GITHUB_OUTPUT"
            echo "gh_env=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "prod=false"    >> "$GITHUB_OUTPUT"
            echo "env=preview"   >> "$GITHUB_OUTPUT"
            echo "gh_env=Preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Start GitHub deployment
        uses: bobheadxi/deployments@v1
        id: gh_deploy
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ steps.target.outputs.gh_env }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          META=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            META="--meta prNumber=${{ github.event.pull_request.number }}"
          fi
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod == 'true' && '--prod' || '' }} $META --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # PR이면 preview URL을 코멘트로 남김 (기존 코멘트 있으면 갱신)
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n🔗 **Vercel Preview 배포 완료**\n\n${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # GitHub Deployments 탭에 결과 기록 (성공/실패 + 배포 URL)
      - name: Finish GitHub deployment
        if: always() && steps.gh_deploy.outputs.deployment_id
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.gh_deploy.outputs.env }}
          deployment_id: ${{ steps.gh_deploy.outputs.deployment_id }}
          env_url: ${{ steps.deploy.outputs.url }}
